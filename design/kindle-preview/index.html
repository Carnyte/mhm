<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FicShelf Kindle-Style Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
<style>
/* Plan: a quiet, cover-first reading app. Paper-white surfaces, near-black ink, one accent (FicShelf's
   navy), Literata for anything a book says (titles, the page itself), the phone's own font for controls.
   Layout: a phone-sized app; on wide screens it sits in a frame with notes beside it. */
:root {
  --paper: #FFFFFF;
  --wash: #F4F4F2;
  --ink: #15171A;
  --ink-2: #5D636B;
  --rule: #E4E5E7;
  --accent: #1F3A5F;
  --accent-ink: #FFFFFF;
  --desk: #E9EAEC;
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1113; --wash: #181B1E; --ink: #ECEDEF; --ink-2: #9CA2AA; --rule: #262A2E;
    --accent: #9DB9E6; --accent-ink: #0F1113; --desk: #050607; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1113; --wash: #181B1E; --ink: #ECEDEF; --ink-2: #9CA2AA; --rule: #262A2E;
  --accent: #9DB9E6; --accent-ink: #0F1113; --desk: #050607; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--desk); color: var(--ink); font-family: var(--ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- stage: framed on wide screens, full-bleed on phones ---------- */
.stage { height: 100%; display: flex; align-items: center; justify-content: center; gap: 40px; padding: 24px; }
.phone { width: 390px; height: 844px; max-height: calc(100vh - 48px); border-radius: 48px; background: var(--paper);
  box-shadow: 0 0 0 10px #1b1c1f, 0 30px 80px rgba(0,0,0,.25); overflow: hidden; position: relative; flex: none; }
.notes { width: 340px; max-height: calc(100vh - 48px); overflow: auto; }
@media (max-width: 860px) {
  .stage { padding: 0; display: block; }
  .phone { width: 100%; height: 100%; max-height: none; border-radius: 0; box-shadow: none; }
  .notes { display: none; }
}

/* ---------- notes ---------- */
.notes h1 { font-family: var(--serif); font-weight: 600; font-size: 26px; margin: 0 0 6px; text-wrap: balance; }
.notes .lede { color: var(--ink-2); font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
.note-card { background: var(--paper); border-radius: 16px; padding: 18px; }
.note-card h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 8px; font-weight: 600; }
.note-card ul { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.55; }
.note-card li + li { margin-top: 6px; }
.before { margin-top: 16px; }
.before img { width: 100%; border-radius: 14px; border: 1px solid var(--rule); display: block; }
.before figcaption { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.seg { display: inline-flex; background: var(--wash); border-radius: 999px; padding: 3px; gap: 2px; margin-top: 14px; }
.seg button { padding: 6px 12px; border-radius: 999px; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* ---------- app shell ---------- */
.app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--paper); }
.statusbar { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; font-size: 14px; font-weight: 600; }
@media (max-width: 860px) { .statusbar { display: none; } }
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 8px 16px 6px; min-height: 52px; }
.topbar .title { font-size: 28px; font-weight: 700; letter-spacing: -.01em; flex: 1; }
.topbar .wordmark { font-family: var(--serif); font-size: 24px; font-weight: 600; flex: 1; letter-spacing: -.01em; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 20px; color: var(--ink); }
.icon-btn:active { background: var(--wash); }
.icon-btn svg { width: 23px; height: 23px; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--rule); background: var(--paper); padding: 6px 0 24px; }
@media (max-width: 860px) { .tabbar { padding-bottom: max(10px, env(safe-area-inset-bottom)); } }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--ink-2); padding-top: 4px; position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tab .dot { position: absolute; top: 2px; left: calc(50% + 8px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--ink); color: var(--paper); font-size: 10px; font-weight: 700; display: grid; place-items: center; }

/* ---------- covers (made from title and author) ---------- */
.cover { position: relative; border-radius: 4px 6px 6px 4px; overflow: hidden; color: #F3EBDD; display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 6px 16px rgba(0,0,0,.12); flex: none; }
.cover::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.22) 0, rgba(0,0,0,0) 7%, rgba(255,255,255,.06) 9%, rgba(0,0,0,0) 14%); }
.cover .frame { position: absolute; inset: 7%; border: 1px solid rgba(243,235,221,.38); border-radius: 2px; }
.cover .band { position: absolute; left: 7%; right: 7%; height: 2px; background: rgba(243,235,221,.38); }
.cover .site { position: relative; font-size: .52em; letter-spacing: .14em; text-transform: uppercase; opacity: .8; padding: 13% 12% 0; font-weight: 600; }
.cover .ct { position: relative; font-family: var(--serif); font-weight: 600; line-height: 1.08; padding: 0 12%; text-wrap: balance; }
.cover .ca { position: relative; font-size: .5em; letter-spacing: .12em; text-transform: uppercase; padding: 0 12% 13%; opacity: .85; font-weight: 600; }

/* ---------- home ---------- */
.hero { margin: 4px 16px 0; padding: 18px; border-radius: 18px; background: var(--wash); display: flex; gap: 16px; }
.hero .meta { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 12px; color: var(--ink-2); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.book-title { font-family: var(--serif); font-weight: 600; font-size: 21px; line-height: 1.15; text-wrap: balance; }
.byline { font-size: 14px; color: var(--ink-2); }
.bar { height: 3px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ink); border-radius: 3px; }
.small { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 10px; font-weight: 600; font-size: 15px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.quiet { background: var(--paper); color: var(--ink); border: 1px solid var(--rule); }
.btn svg { width: 18px; height: 18px; }
.row-head { display: flex; align-items: baseline; justify-content: space-between; padding: 26px 16px 10px; }
.row-head h3 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.row-head button { font-size: 14px; color: var(--accent); }
.shelf { display: flex; gap: 14px; overflow-x: auto; padding: 0 16px 6px; scrollbar-width: none; }
.shelf::-webkit-scrollbar { display: none; }
.shelf-item { width: 104px; flex: none; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.shelf-item .t { font-size: 13px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.flag { position: absolute; top: 0; right: 10%; background: var(--paper); color: var(--ink); font-size: 9px; font-weight: 800; letter-spacing: .06em; padding: 3px 5px 4px; border-radius: 0 0 3px 3px; z-index: 2; font-family: var(--ui); }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .live i { animation: none; } }

/* ---------- library ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--rule); font-size: 14px; color: var(--ink); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); font-weight: 600; }
.toolbar { display: flex; align-items: center; justify-content: space-between; padding: 2px 16px 12px; }
.toolbar .sort { font-size: 14px; color: var(--ink-2); display: inline-flex; gap: 4px; align-items: center; }
.toolbar .views { display: inline-flex; gap: 2px; }
.toolbar .views button { width: 34px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--ink-2); }
.toolbar .views button[aria-pressed="true"] { background: var(--wash); color: var(--ink); }
.toolbar svg { width: 18px; height: 18px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px 14px; padding: 0 16px 28px; }
.tile { display: flex; flex-direction: column; gap: 7px; text-align: left; min-width: 0; }
.tile .under { display: flex; align-items: center; gap: 6px; }
.tile .under .bar { flex: 1; }
.tile .pct { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 26px; text-align: right; }
.cloud { width: 14px; height: 14px; color: var(--ink-2); flex: none; }
.list { padding: 0 16px 28px; }
.list-row { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--rule); text-align: left; width: 100%; align-items: center; }
.list-row .lm { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.list-row .lt { font-family: var(--serif); font-weight: 600; font-size: 17px; line-height: 1.2; }

/* ---------- story ---------- */
.detail { padding: 6px 20px 32px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.detail .book-title { font-size: 26px; margin-top: 10px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.tag { font-size: 12px; color: var(--ink-2); padding: 3px 9px; border-radius: 999px; background: var(--wash); }
.detail .actions { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.detail .actions .btn { width: 100%; min-height: 50px; font-size: 16px; }
.mini-actions { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; margin-top: 4px; }
.mini-actions button { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-2); padding: 6px 0; }
.mini-actions svg { width: 22px; height: 22px; color: var(--ink); }
.section { width: 100%; text-align: left; border-top: 1px solid var(--rule); padding-top: 16px; margin-top: 8px; }
.section h4 { margin: 0 0 8px; font-size: 16px; font-weight: 700; }
.blurb { font-family: var(--serif); font-size: 16px; line-height: 1.6; margin: 0; }
.blurb.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.link { color: var(--accent); font-size: 15px; font-weight: 600; margin-top: 6px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; font-size: 14px; margin: 0; }
.facts dt { color: var(--ink-2); }
.facts dd { margin: 0; }
.row-link { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 4px 0; font-size: 16px; font-weight: 700; }
.row-link span { font-size: 14px; font-weight: 400; color: var(--ink-2); }

/* ---------- reader ---------- */
.reader { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; }
.reader[data-rt="white"] { --r-bg: #FFFFFF; --r-ink: #1C1C1C; --r-mute: #8A8A8A; --r-chrome: rgba(255,255,255,.97); }
.reader[data-rt="sepia"] { --r-bg: #F6EEDC; --r-ink: #3B2F22; --r-mute: #8E7C64; --r-chrome: rgba(246,238,220,.97); }
.reader[data-rt="green"] { --r-bg: #E4EFE5; --r-ink: #1F2E24; --r-mute: #6C8072; --r-chrome: rgba(228,239,229,.97); }
.reader[data-rt="black"] { --r-bg: #000000; --r-ink: #C9C9C9; --r-mute: #6E6E6E; --r-chrome: rgba(18,18,18,.97); }
.reader { background: var(--r-bg); color: var(--r-ink); }
.r-viewport { position: absolute; top: 56px; bottom: 44px; left: 28px; right: 28px; overflow: hidden; }
@media (max-width: 860px) { .r-viewport { top: 28px; } }
.r-columns { height: 100%; column-fill: auto; font-family: var(--serif); line-height: 1.62; transition: transform .28s ease; }
@media (prefers-reduced-motion: reduce) { .r-columns { transition: none; } }
.r-columns h2 { font-weight: 600; font-size: 1.45em; margin: 1.2em 0 1em; text-align: center; line-height: 1.2; break-after: avoid; }
.r-columns .ch-no { display: block; text-align: center; font-family: var(--ui); font-size: .62em; letter-spacing: .18em; text-transform: uppercase; color: var(--r-mute); margin-top: 1.4em; }
.r-columns p { margin: 0; text-indent: 1.4em; hyphens: auto; -webkit-hyphens: auto; text-align: justify; }
.r-columns p.first { text-indent: 0; }
.r-columns p.break { text-align: center; text-indent: 0; margin: .8em 0; color: var(--r-mute); }
.r-footer { position: absolute; left: 28px; right: 28px; bottom: 16px; display: flex; justify-content: space-between; font-size: 11px; color: var(--r-mute); font-variant-numeric: tabular-nums; font-family: var(--ui); }
.r-zones { position: absolute; inset: 0; display: grid; grid-template-columns: 30% 40% 30%; z-index: 2; }
.r-zones button { height: 100%; }
.r-top, .r-bottom { position: absolute; left: 0; right: 0; z-index: 3; background: var(--r-chrome); font-family: var(--ui); transition: transform .22s ease, opacity .22s ease; }
.r-top { top: 0; padding: 8px 10px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid rgba(127,127,127,.18); }
@media (min-width: 861px) { .r-top { padding-top: 46px; } }
.r-top .rt { flex: 1; min-width: 0; text-align: center; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-bottom { bottom: 0; padding: 14px 20px 26px; border-top: 1px solid rgba(127,127,127,.18); display: flex; flex-direction: column; gap: 10px; }
.reader:not(.chrome) .r-top { transform: translateY(-100%); opacity: 0; pointer-events: none; }
.reader:not(.chrome) .r-bottom { transform: translateY(100%); opacity: 0; pointer-events: none; }
.reader.chrome .r-footer { opacity: 0; }
.scrub { position: relative; height: 22px; display: flex; align-items: center; }
.scrub .track { position: absolute; left: 0; right: 0; height: 3px; border-radius: 3px; background: rgba(127,127,127,.3); }
.scrub .fill { position: absolute; left: 0; height: 3px; border-radius: 3px; background: var(--r-ink); }
.scrub .tick { position: absolute; width: 1px; height: 9px; background: rgba(127,127,127,.55); }
.scrub .knob { position: absolute; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--r-ink); }
.r-bottom .line { display: flex; justify-content: space-between; font-size: 12px; color: var(--r-mute); font-variant-numeric: tabular-nums; }
.r-bottom .tools { display: flex; justify-content: space-around; }
.r-bottom .tools button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--r-mute); }
.r-bottom .tools svg { width: 22px; height: 22px; color: var(--r-ink); }
.r-icon { width: 40px; height: 40px; display: grid; place-items: center; color: var(--r-ink); }
.r-icon svg { width: 22px; height: 22px; }

/* ---------- sheets ---------- */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.32); z-index: 40; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--paper); color: var(--ink); border-radius: 18px 18px 0 0; padding: 10px 20px 30px; max-height: 80%; overflow: auto; font-family: var(--ui); }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--rule); margin: 0 auto 14px; }
.sheet h5 { font-size: 17px; margin: 0 0 14px; font-weight: 700; }
.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.swatch { height: 64px; border-radius: 12px; border: 1px solid rgba(127,127,127,.3); display: grid; place-items: center; font-family: var(--serif); font-size: 20px; }
.swatch[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.swatch small { display: block; font-family: var(--ui); font-size: 11px; }
.setting { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
.stepper { display: inline-flex; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.stepper button { width: 52px; height: 38px; font-family: var(--serif); }
.stepper button + button { border-left: 1px solid var(--rule); }
.opts { display: inline-flex; gap: 6px; }
.opts button { padding: 7px 12px; border-radius: 9px; border: 1px solid var(--rule); font-size: 14px; }
.opts button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.toc-row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--rule); width: 100%; text-align: left; font-size: 15px; }
.toc-row .n { width: 26px; color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 13px; }
.toc-row .tt { flex: 1; }
.toc-row.read .tt { color: var(--ink-2); }
.toc-row.cur .tt { font-weight: 700; }
.toc-row svg { width: 16px; height: 16px; color: var(--ink-2); }

/* ---------- discover / more ---------- */
.searchbox { margin: 4px 16px 14px; display: flex; align-items: center; gap: 10px; background: var(--wash); border-radius: 12px; padding: 0 14px; min-height: 46px; color: var(--ink-2); font-size: 16px; }
.searchbox svg { width: 19px; height: 19px; }
.group { margin: 0 16px 18px; border-radius: 14px; background: var(--wash); overflow: hidden; }
.group-title { padding: 18px 20px 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.item { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; font-size: 16px; }
.item + .item { border-top: 1px solid var(--rule); }
.item svg { width: 22px; height: 22px; flex: none; }
.item .sub { font-size: 13px; color: var(--ink-2); display: block; margin-top: 2px; }
.item .val { margin-left: auto; font-size: 14px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; }
.item .val svg { width: 16px; height: 16px; }
.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px; }
.cat { padding: 16px; border-radius: 14px; background: var(--wash); text-align: left; font-weight: 600; font-size: 15px; display: flex; flex-direction: column; gap: 3px; }
.cat span { font-size: 12px; font-weight: 400; color: var(--ink-2); }
.callout { margin: 18px 16px 24px; padding: 18px; border-radius: 16px; border: 1px solid var(--rule); display: flex; gap: 14px; align-items: flex-start; }
.callout svg { width: 26px; height: 26px; flex: none; color: var(--accent); }
.callout b { display: block; font-size: 16px; margin-bottom: 4px; }
.callout p { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.45; }
.seg-wide { display: grid; grid-template-columns: 1fr 1fr; margin: 0 16px 16px; background: var(--wash); padding: 3px; border-radius: 10px; }
.seg-wide button { padding: 8px; border-radius: 8px; font-size: 14px; color: var(--ink-2); }
.seg-wide button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* ---------- phone-only "about this preview" ---------- */
.about-btn { position: absolute; right: 14px; bottom: 84px; z-index: 30; background: var(--ink); color: var(--paper); font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
@media (min-width: 861px) { .about-btn { display: none; } }
@media (max-width: 860px) { .screen::after { content: ""; display: block; height: 56px; } }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="app" id="app"></div>
  </div>
  <aside class="notes" id="notes" aria-live="polite"></aside>

/* ---------- covers ---------- */
function cover(s, w, opts = {}) {
  const h = Math.round(w * 1.5);
  const c = CLOTH[hash(s.title) % CLOTH.length];
  const len = s.title.length;
  const fs = Math.round(w * (len > 26 ? 0.115 : len > 16 ? 0.135 : 0.16));
  const band = hash(s.author) % 2 ? `<div class="band" style="top:${Math.round(h * 0.62)}px"></div>` : '';
  const flag = opts.flag ? `<div class="flag">${opts.flag}</div>` : '';
  return `<div class="cover" style="width:${w}px;height:${h}px;background:${c};font-size:${Math.max(9, Math.round(w * 0.11))}px" aria-hidden="true">
    <div class="frame"></div>${band}${flag}
    <div class="site">${s.site === 'Clipped' ? 'Clipped' : s.site === 'File' ? 'EPUB' : s.site}</div>
    <div class="ct" style="font-size:${fs}px">${s.title}</div>
    <div class="ca">${s.author}</div>
  </div>`;
}
const bar = (pct) => `<div class="bar"><i style="width:${pct}%"></i></div>`;

/* ---------- reader ---------- */
const CHAPTER = `
<span class="ch-no">Chapter 4</span><h2>What the Trees Remember</h2>
<p class="first">The orchard woke before Nell did. She heard it through the farmhouse wall: a thin, glassy chiming, like someone running a wet finger around the rim of a hundred wine glasses at once, rising and falling with the wind off the hill.</p>
<p>She lay still and counted. Forty trees in the east rows, if the deed was right. Thirty-one were singing. The rest were silent, and she did not know whether that meant they were asleep or broken or simply had nothing to say to her.</p>
<p>Downstairs, Aurelio had already made coffee and burned the toast, which was becoming a pattern. He was sitting at the kitchen table with her grandmother’s ledger open in front of him, reading it the way other people read letters from someone they missed.</p>
<p>“You’re in my chair,” she said.</p>
<p>“It’s a chair.” He did not look up. “Did you know she wrote down every night they sang? Fifty-two years. She drew little marks for the quiet ones.”</p>
<p>Nell poured coffee into the least chipped mug and sat across from him. The ledger’s pages were soft as cloth. Her grandmother’s handwriting marched down every one of them, the same three columns, the same small stars, the same careful dashes for the silent nights.</p>
<p>“She never told me,” Nell said.</p>
<p>“Would you have listened?”</p>
<p>It was a fair question, and she hated him a little for asking it. At sixteen she had wanted nothing to do with a farm that grew nothing anyone could eat. At thirty she had wanted the money it would bring. Somewhere in between, her grandmother had stopped calling.</p>
<p class="break">⁂</p>
<p class="first">They walked the east rows after breakfast. The frost had made the glass branches cloudy, and where the sun touched them they cleared slowly, the way a breath fades from a window. Aurelio carried the ledger under one arm and stopped at every silent tree, laying his palm flat against the trunk as though taking its temperature.</p>
<p>“This one went quiet in March,” he said. “The year your grandfather died. And this one—” He moved down the row. “October, nineteen ninety-one.”</p>
<p>“What happened in ninety-one?”</p>
<p>“You were born,” he said, and turned the ledger so she could see the date, and the small star beside it, and the words in the margin that her grandmother had underlined twice: <i>she will come back for them.</i></p>
<p>Nell did not say anything for a long moment. Above them the singing trees went on with their high, patient music, and the silent ones stood among them like guests who had not yet been introduced.</p>
<p>“I’m not keeping it,” she said finally. “The orchard. I can’t.”</p>
<p>“I know,” Aurelio said. “But you could learn what it says before you sell it.”</p>
<p>She looked at the tree in front of her, the one that had stopped singing the year she was born, and for the first time since she had arrived she reached out and touched it. The glass was colder than she expected, and under the cold, very faintly, something hummed.</p>`;

function reader() {
  const s = byId[state.story];
  const ticks = Array.from({ length: s.chapters - 1 }, (_, i) => `<i class="tick" style="left:${((i + 1) / s.chapters) * 100}%"></i>`).join('');
  const chapterPct = state.pages > 1 ? state.page / (state.pages - 1) : 0;
  const storyPct = Math.round(((s.cur - 1 + chapterPct) / s.chapters) * 100);
  const left = Math.max(1, Math.round(s.mins * (1 - chapterPct)));
  return `
  <div class="reader ${state.chrome ? 'chrome' : ''}" data-rt="${state.rt}">
    <div class="r-viewport"><div class="r-columns" id="cols" style="font-size:${state.size}px;font-family:${state.font === 'Georgia' ? 'Georgia, serif' : state.font === 'System' ? 'var(--ui)' : 'var(--serif)'}">${CHAPTER}</div></div>
    <div class="r-footer"><span>${left} min left in chapter</span><span>${storyPct}%</span></div>
    <div class="r-zones"><button data-turn="-1" aria-label="Previous page"></button><button data-chrome aria-label="Show controls"></button><button data-turn="1" aria-label="Next page"></button></div>
    <div class="r-top">
      <button class="r-icon" data-close-reader aria-label="Back to the story">${I.back}</button>
      <div class="rt">${s.title}</div>
      <button class="r-icon" data-sheet="aa" aria-label="Text and theme">${I.aa}</button>
      <button class="r-icon" aria-label="Search in the story">${I.search}</button>
      <button class="r-icon" aria-label="Bookmark this page">${I.bookmark}</button>
    </div>
    <div class="r-bottom">
      <div class="scrub" aria-label="Position in the story"><div class="track"></div>${ticks}<div class="fill" style="width:${storyPct}%"></div><div class="knob" style="left:${storyPct}%"></div></div>
      <div class="line"><span>Chapter ${s.cur} of ${s.chapters} · ${left} min left</span><span>Page ${state.page + 1} of ${state.pages} · ${storyPct}%</span></div>
      <div class="tools">
        <button data-sheet="toc">${I.toc}Contents</button>
        <button>${I.prevCh}Previous</button>
        <button>${I.headphones}Listen</button>
        <button>${I.nextCh}Next</button>
      </div>
    </div>
  </div>`;
}

/* ---------- sheets ---------- */
function sheet() {
  if (!state.sheet) return '';
  const s = state.story ? byId[state.story] : byId.orchard;
  let body = '';
  if (state.sheet === 'aa') {
    const sw = [['white', '#FFFFFF', '#1C1C1C', 'White'], ['sepia', '#F6EEDC', '#3B2F22', 'Sepia'], ['green', '#E4EFE5', '#1F2E24', 'Green'], ['black', '#000000', '#C9C9C9', 'Black']];
    body = `<h5>Text and theme</h5>
    <div class="swatches">${sw.map(([k, bg, fg, label]) => `<button class="swatch" data-rt="${k}" aria-pressed="${state.rt === k}" style="background:${bg};color:${fg}"><span>Aa<small>${label}</small></span></button>`).join('')}</div>
    <div class="setting"><span>Text size</span><div class="stepper"><button data-size="-1" aria-label="Smaller text" style="font-size:14px">A</button><button data-size="1" aria-label="Larger text" style="font-size:20px">A</button></div></div>
    <div class="setting"><span>Font</span><div class="opts">${['Literata', 'Georgia', 'System'].map((f) => `<button data-font="${f}" aria-pressed="${state.font === f}">${f}</button>`).join('')}</div></div>
    <div class="setting" style="border:0"><span>Turn pages</span><div class="opts">${[['pages', 'Pages'], ['scroll', 'Scroll']].map(([k, l]) => `<button data-layout="${k}" aria-pressed="${state.layout === k}">${l}</button>`).join('')}</div></div>
    <p class="small" style="margin:6px 0 0">Every option you have today (spacing, margins, width, brightness, read aloud) stays, one tap further in.</p>`;
  } else if (state.sheet === 'toc') {
    body = `<h5>Contents</h5>${Array.from({ length: s.chapters }, (_, i) => {
      const n = i + 1;
      const cls = n < s.cur ? 'read' : n === s.cur ? 'cur' : '';
      const name = s.id === 'orchard' ? ['The Deed', 'Nell Arrives', 'Burnt Toast', 'What the Trees Remember', 'Frost', 'The Ledger', 'October', 'Listening', 'Ninety-One', 'The Buyer', 'Thaw', 'What It Says'][i] : `Chapter ${n}`;
      return `<button class="toc-row ${cls}"><span class="n">${n}</span><span class="tt">${name}</span>${n < s.cur ? I.check : n === s.cur ? '<span class="small">Reading</span>' : ''}</button>`;
    }).join('')}`;
  } else if (state.sheet === 'add') {
    body = `<h5>Add to your library</h5>
    <div class="group" style="margin:0">
      <button class="item">${I.cut}<span>Clip a whole story<span class="sub">Paste the first chapter of a story from any website</span></span></button>
      <button class="item">${I.file}<span>Import a file<span class="sub">EPUB, HTML, text or Markdown</span></span></button>
      <button class="item">${I.link}<span>Open a link<span class="sub">FanFiction.net or AO3 stories open in the app</span></span></button>
    </div>`;
  } else if (state.sheet === 'clipping') {
    const c = byId.ninth;
    body = `<h5>Clipping in the background</h5>
    <div style="display:flex;gap:14px;align-items:center">${cover(c, 64)}<div><div class="book-title" style="font-size:18px">${c.title}</div><div class="small">reads.example.com</div><div class="live" style="margin-top:6px"><i></i>Chapter 37 saved · next in 9 s</div></div></div>
    <p class="small" style="margin:16px 0">FicShelf clips one chapter at a time while the app is open, and asks you if a site wants you to log in or check you’re human.</p>
    <div style="display:flex;gap:8px"><button class="btn quiet">Pause</button><button class="btn quiet">Stop</button></div>`;
  }
  return `<div class="scrim" data-close-sheet></div><div class="sheet" role="dialog" aria-label="Sheet"><div class="grab"></div>${body}</div>`;
}

/* ---------- notes beside the phone ---------- */
const NOTES = {
  home: ['Opens on what you’re reading: one large Continue card with progress and time left, instead of the FanFiction.net catalogue.', 'Rows of covers below: new chapters (replaces the Updates tab), stories clipping in the background, recently added.', 'Every story gets a cover made from its title and author, in a bookbinding colour picked from the title.', 'Browsing FanFiction.net and AO3 moves to Discover.'],
  library: ['A cover grid by default, three across, with a thin progress bar under each. Switch to a compact list with the icons on the right.', 'One row of filters (New, Downloaded, Unread, In progress, Finished, Collections) and one sort replace six shelves.', 'A small NEW flag replaces the green +2 badge; a cloud marks stories not downloaded.', 'One + button for adding stories instead of four unlabelled icons.'],
  story: ['A large centred cover, the title in a book typeface, one main button.', 'Listen, Download, Collection and Share as labelled icons.', 'The description folds to four lines; chapters move to Contents; the stats grid becomes one line plus Details.'],
  reader: ['Tap the middle to show or hide the controls; tap the edges to turn the page.', 'With the controls hidden, a faint line shows time left in the chapter and your place in the story.', 'Controls: back, Aa, search, bookmark on top; a scrubber with chapter marks, Contents, Listen and chapter buttons below.', 'Aa: four page colours, size, font and pages or scroll. The chapter heading shows once.'],
  discover: ['Search and the FanFiction.net and AO3 catalogues together, one tab instead of Browse plus Search.', 'Clipping a whole story from any website starts here too.'],
  more: ['Account, background clipping, bookmarks, collections, drafts and settings in one calm list.', 'Four tabs instead of five: Updates lives in Home and the Library’s New filter.'],
};
const NOTE_KEY = () => (state.reading ? 'reader' : state.story ? 'story' : state.tab);
function renderNotes() {
  const k = NOTE_KEY();
  const names = { home: 'Home', library: 'Library', story: 'Story page', reader: 'Reader', discover: 'Discover', more: 'More' };
  notes.innerHTML = `
    <h1>FicShelf, Kindle-style</h1>
    <p class="lede">A preview to try before anything changes in the app. Tap around: covers open stories, Continue opens the reader, the tabs switch screens. Your current app is unchanged.</p>
    <div class="note-card">
      <h2>${names[k]}: what changes</h2>
      <ul>${NOTES[k].map((n) => `<li>${n}</li>`).join('')}</ul>
      <div class="seg" role="group" aria-label="Compare"><button data-notes="after" aria-pressed="${!state.notesBefore}">Preview</button><button data-notes="before" aria-pressed="${state.notesBefore}">Today’s app</button></div>
      ${state.notesBefore ? `<figure class="before"><img src="${BEFORE[k]}" alt="Today’s ${names[k]} screen"><figcaption>Today’s ${names[k].toLowerCase()} screen (taken from the current build).</figcaption></figure>` : ''}
    </div>`;
}

/* ---------- render ---------- */
function render() {
  const scrollEl = app.querySelector('.screen');
  const keep = scrollEl && !state.reading ? scrollEl.scrollTop : 0;
  const screen = state.story ? story() : { home, library, discover, more }[state.tab]();
  const tabs = [['home', 'Home', I.home, I.homeOn], ['library', 'Library', I.library, I.libraryOn], ['discover', 'Discover', I.compass, I.compassOn], ['more', 'More', I.more, I.more]];
  app.innerHTML = `
    <div class="statusbar"><span>9:41</span><span>●●● 􀙇</span></div>
    <div class="screen" id="screen">${screen}</div>
    <nav class="tabbar">${tabs.map(([k, l, ic, on]) => `<button class="tab" data-tab="${k}" ${state.tab === k && !state.story ? 'aria-current="page"' : ''}>${state.tab === k && !state.story ? on : ic}${l}${k === 'home' ? '<span class="dot">3</span>' : ''}</button>`).join('')}</nav>
    ${state.reading ? reader() : ''}
    ${sheet()}
    ${state.reading || state.sheet ? '' : '<button class="about-btn" data-about>About this preview</button>'}`;
  app.querySelector('.statusbar').lastElementChild.textContent = '';
  if (state.keepScroll) app.querySelector('.screen').scrollTop = keep;
  state.keepScroll = false;
  if (state.reading) layoutReader();
  renderNotes();
}

function layoutReader() {
  const cols = document.getElementById('cols');
  if (!cols) return;
  const vp = cols.parentElement;
  const w = vp.clientWidth;
  const gap = 56;
  if (state.layout === 'pages') {
    cols.style.columnWidth = w + 'px';
    cols.style.columnGap = gap + 'px';
    cols.style.height = '100%';
    vp.style.overflowY = 'hidden';
    const pages = Math.max(1, Math.round((cols.scrollWidth + gap) / (w + gap)));
    if (pages !== state.pages) {
      state.pages = pages;
      state.page = Math.min(state.page, pages - 1);
      render();
      return;
    }
    cols.style.transform = `translateX(${-state.page * (w + gap)}px)`;
  } else {
    cols.style.columnWidth = 'auto';
    cols.style.height = 'auto';
    cols.style.transform = 'none';
    vp.style.overflowY = 'auto';
    state.pages = 1;
  }
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-close-sheet]');
  if (!t) return;
  const d = t.dataset;
  if ('about' in d) { state.sheet = null; showAbout(); return; }
  if (d.tab) { state.tab = d.tab; state.story = null; state.reading = false; state.sheet = null; }
  else if (d.go) { state.tab = d.go; state.story = null; if (d.filter) state.libFilter = d.filter; }
  else if (d.open) { state.story = d.open; state.blurbOpen = false; }
  else if ('back' in d) { state.story = null; }
  else if (d.read) { state.story = d.read; state.reading = true; state.chrome = false; state.page = 0; state.pages = 1; }
  else if ('closeReader' in d) { state.reading = false; state.sheet = null; }
  else if ('chrome' in d) { state.chrome = !state.chrome; state.keepScroll = true; }
  else if (d.turn) {
    if (state.chrome) { state.chrome = false; }
    else if (state.layout === 'pages') state.page = Math.max(0, Math.min(state.pages - 1, state.page + Number(d.turn)));
  }
  else if (d.sheet) { state.sheet = d.sheet; state.keepScroll = true; }
  else if ('closeSheet' in d) { state.sheet = null; state.keepScroll = true; }
  else if (d.rt) { state.rt = d.rt; }
  else if (d.size) { state.size = Math.max(14, Math.min(28, state.size + Number(d.size) * 2)); state.page = 0; }
  else if (d.font) { state.font = d.font; state.page = 0; }
  else if (d.layout) { state.layout = d.layout; state.page = 0; }
  else if (d.filter) { state.libFilter = d.filter; state.keepScroll = true; }
  else if (d.view) { state.libView = d.view; state.keepScroll = true; }
  else if ('blurb' in d) { state.blurbOpen = !state.blurbOpen; state.keepScroll = true; }
  else if (d.site) { state.discoverSite = d.site; state.keepScroll = true; }
  else if (d.notes) { state.notesBefore = d.notes === 'before'; renderNotes(); return; }
  else return;
  render();
});
document.addEventListener('keydown', (e) => {
  if (!state.reading || state.layout !== 'pages') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    state.page = Math.max(0, Math.min(state.pages - 1, state.page + (e.key === 'ArrowRight' ? 1 : -1)));
    layoutReader();
    render();
  }
});
window.addEventListener('resize', () => state.reading && layoutReader());

/* On a phone the notes open as a sheet. */
function showAbout() {
  const k = NOTE_KEY();
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-label="About this preview"><div class="grab"></div>
    <h5>About this preview</h5><p class="small" style="margin:0 0 12px">A preview of FicShelf, Kindle-style, to try before anything changes in the app. Your current app is unchanged.</p>
    <b style="font-size:15px">This screen</b><ul style="font-size:14px;line-height:1.5;padding-left:18px">${NOTES[k].map((n) => `<li>${n}</li>`).join('')}</ul>
    <b style="font-size:15px">Today’s app</b><img src="${BEFORE[k]}" alt="Today’s screen" style="width:100%;border-radius:12px;margin-top:8px;border:1px solid var(--rule)">
    <button class="btn quiet" style="width:100%;margin-top:14px" id="about-close">Close</button></div>`;
  app.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.querySelector('.scrim').addEventListener('click', close);
  wrap.querySelector('#about-close').addEventListener('click', close);
}

document.fonts && document.fonts.ready.then(() => state.reading && layoutReader());
render();
</script>
</body>
</html>
